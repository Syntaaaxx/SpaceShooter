  <rect x="28" y="14" width="5" height="26" fill="#5a606b" opacity="0.48"/>
  <rect x="58" y="20" width="5" height="22" fill="#858a93" opacity="0.38"/>
  <rect x="18" y="28" width="4" height="16" fill="#434852" opacity="0.42"/>

  <!-- Large asteroid -->
  <rect x="38" y="44" width="22" height="5" fill="#8a6a4a"/>
  <rect x="28" y="49" width="38" height="10" fill="#9a7856"/>
  <rect x="22" y="59" width="50" height="14" fill="#7b5a3d"/>
  <rect x="16" y="73" width="54" height="10" fill="#6a4b33"/>
