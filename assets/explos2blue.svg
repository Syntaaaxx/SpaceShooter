<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" shape-rendering="crispEdges">
  <title>Blue Explosion Frame 2</title>

  <!-- Wide electric blast -->
  <rect x="40" y="8" width="16" height="16" fill="#7df9ff"/>
  <rect x="24" y="24" width="48" height="16" fill="#4ddcff"/>
  <rect x="16" y="40" width="64" height="16" fill="#1ca7ff"/>
  <rect x="24" y="56" width="48" height="16" fill="#006dff"/>
  <rect x="40" y="72" width="16" height="16" fill="#0047b8"/>

  <!-- Side shockwave pixels -->
  <rect x="8" y="40" width="8" height="16" fill="#00aaff"/>
  <rect x="80" y="40" width="8" height="16" fill="#00aaff"/>
  <rect x="24" y="16" width="16" height="8" fill="#7df9ff"/>
  <rect x="56" y="16" width="16" height="8" fill="#7df9ff"/>

  <!-- Bright white-blue core -->
  <rect x="32" y="32" width="32" height="8" fill="#e8ffff"/>
  <rect x="24" y="40" width="48" height="16" fill="#a8f6ff"/>
  <rect x="32" y="56" width="32" height="8" fill="#4ddcff"/>

  <!-- Flying energy shards -->
  <rect x="16" y="16" width="8" height="8" fill="#9ffbff"/>
  <rect x="72" y="20" width="8" height="8" fill="#4ddcff"/>
  <rect x="8" y="64" width="8" height="8" fill="#006dff"/>
  <rect x="80" y="64" width="8" height="8" fill="#003fa3"/>
  <rect x="48" y="88" width="8" height="8" fill="#4ddcff"/>

  <!-- Blue smoke -->
  <rect x="40" y="0" width="8" height="8" fill="#5e7894"/>
  <rect x="56" y="8" width="8" height="8" fill="#48617a"/>
  <rect x="16" y="72" width="8" height="8" fill="#3c526b"/>
  <rect x="72" y="72" width="8" height="8" fill="#506b88"/>
</svg>