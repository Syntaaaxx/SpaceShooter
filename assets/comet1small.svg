<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 48" shape-rendering="crispEdges">
  <title>Tiny Falling Rock 01</title>

  <!-- Upward streaks -->
  <rect x="14" y="4" width="3" height="12" fill="#5f646e" opacity="0.55"/>
  <rect x="20" y="8" width="3" height="8" fill="#777b84" opacity="0.4"/>

  <!-- Rock -->
  <rect x="12" y="20" width="10" height="4" fill="#9a7856"/>
  <rect x="8" y="24" width="18" height="8" fill="#7b5a3d"/>
  <rect x="10" y="32" width="14" height="6" fill="#5a3f2c"/>
  <rect x="14" y="38" width="8" height="4" fill="#3f2d22"/>

  <!-- Highlight -->
  <rect x="12" y="24" width="6" height="3" fill="#b58a62"/>

  <!-- Crater -->
  <rect x="20" y="28" width="4" height="4" fill="#3f2d22"/>
</svg>