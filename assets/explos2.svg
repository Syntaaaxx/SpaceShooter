<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" shape-rendering="crispEdges">
  <title>Comet Explosion Frame 2</title>

  <!-- Larger blast shape -->
  <rect x="40" y="8" width="16" height="16" fill="#ffcc3d"/>
  <rect x="24" y="24" width="48" height="16" fill="#ffcc3d"/>
  <rect x="16" y="40" width="64" height="16" fill="#ff8a24"/>
  <rect x="24" y="56" width="48" height="16" fill="#ff5a1f"/>
  <rect x="40" y="72" width="16" height="16" fill="#c9351a"/>

  <!-- Side flames -->
  <rect x="8" y="40" width="8" height="16" fill="#ff5a1f"/>
  <rect x="80" y="40" width="8" height="16" fill="#ff5a1f"/>
  <rect x="24" y="16" width="16" height="8" fill="#ff8a24"/>
  <rect x="56" y="16" width="16" height="8" fill="#ff8a24"/>

  <!-- Bright core -->
  <rect x="32" y="32" width="32" height="8" fill="#fff2a6"/>
  <rect x="24" y="40" width="48" height="16" fill="#ffd95a"/>
  <rect x="32" y="56" width="32" height="8" fill="#ffcc3d"/>

  <!-- Flying rock chunks -->
  <rect x="16" y="16" width="8" height="8" fill="#5a3f2c"/>
  <rect x="72" y="20" width="8" height="8" fill="#4a3528"/>
  <rect x="8" y="64" width="8" height="8" fill="#3f2d22"/>
  <rect x="80" y="64" width="8" height="8" fill="#5a3f2c"/>
  <rect x="48" y="88" width="8" height="8" fill="#3f2d22"/>

  <!-- Smoke -->
  <rect x="40" y="0" width="8" height="8" fill="#777777"/>
  <rect x="56" y="8" width="8" height="8" fill="#5f5f5f"/>
  <rect x="16" y="72" width="8" height="8" fill="#555555"/>
  <rect x="72" y="72" width="8" height="8" fill="#666666"/>
</svg>