<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 128" shape-rendering="crispEdges">
  <title>Red Pixel Heart with Grey Outline</title>

  <!-- Grey outline heart shape -->
  <rect x="16" y="0" width="48" height="16" fill="#5f6368"/>
  <rect x="80" y="0" width="48" height="16" fill="#5f6368"/>

  <rect x="0" y="16" width="144" height="16" fill="#5f6368"/>
  <rect x="0" y="32" width="144" height="16" fill="#5f6368"/>
  <rect x="0" y="48" width="144" height="16" fill="#5f6368"/>

  <rect x="16" y="64" width="112" height="16" fill="#5f6368"/>
  <rect x="32" y="80" width="80" height="16" fill="#5f6368"/>
  <rect x="48" y="96" width="48" height="16" fill="#5f6368"/>
  <rect x="64" y="112" width="16" height="16" fill="#5f6368"/>

  <!-- Red heart fill -->
  <rect x="32" y="16" width="32" height="16" fill="#ff2b2b"/>
  <rect x="80" y="16" width="32" height="16" fill="#ff2b2b"/>

  <rect x="16" y="32" width="112" height="16" fill="#ff2b2b"/>
  <rect x="16" y="48" width="112" height="16" fill="#ff2b2b"/>

  <rect x="32" y="64" width="80" height="16" fill="#ff2b2b"/>
  <rect x="48" y="80" width="48" height="16" fill="#ff2b2b"/>
  <rect x="64" y="96" width="16" height="16" fill="#ff2b2b"/>
</svg>