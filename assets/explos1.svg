<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" shape-rendering="crispEdges">
  <title>Comet Explosion Frame 1</title>

  <!-- Small first burst -->
  <rect x="40" y="24" width="16" height="8" fill="#ffcc3d"/>
  <rect x="32" y="32" width="32" height="8" fill="#ffcc3d"/>
  <rect x="24" y="40" width="48" height="16" fill="#ff8a24"/>
  <rect x="32" y="56" width="32" height="8" fill="#ff5a1f"/>
  <rect x="40" y="64" width="16" height="8" fill="#c9351a"/>

  <!-- Bright core -->
  <rect x="40" y="40" width="16" height="16" fill="#fff2a6"/>
  <rect x="32" y="48" width="32" height="8" fill="#ffd95a"/>

  <!-- Rock chunks -->
  <rect x="24" y="28" width="8" height="8" fill="#5a3f2c"/>
  <rect x="64" y="32" width="8" height="8" fill="#4a3528"/>
  <rect x="28" y="64" width="8" height="8" fill="#3f2d22"/>
  <rect x="64" y="60" width="8" height="8" fill="#5a3f2c"/>

  <!-- Smoke pixels -->
  <rect x="40" y="16" width="8" height="8" fill="#6b6b6b"/>
  <rect x="56" y="72" width="8" height="8" fill="#555555"/>
</svg>