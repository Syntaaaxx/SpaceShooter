<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 80" shape-rendering="crispEdges">
  <title>Wide Falling Rock 01</title>

  <!-- Upward streaks -->
  <rect x="34" y="4" width="4" height="22" fill="#626772" opacity="0.55"/>
  <rect x="22" y="10" width="4" height="18" fill="#4a4f5a" opacity="0.45"/>
  <rect x="48" y="16" width="4" height="12" fill="#777b84" opacity="0.4"/>

  <!-- Wide rock -->
  <rect x="28" y="30" width="24" height="4" fill="#7d7468"/>
  <rect x="20" y="34" width="38" height="8" fill="#8b8173"/>
  <rect x="14" y="42" width="50" height="12" fill="#70675d"/>
  <rect x="18" y="54" width="46" height="8" fill="#5f564f"/>
  <rect x="24" y="62" width="34" height="8" fill="#4d4641"/>
  <rect x="34" y="70" width="16" height="4" fill="#39332f"/>

  <!-- Jagged sides -->
  <rect x="10" y="46" width="8" height="8" fill="#70675d"/>
  <rect x="62" y="50" width="6" height="8" fill="#5f564f"/>
  <rect x="22" y="30" width="8" height="4" fill="#7d7468"/>

  <!-- Highlights -->
  <rect x="24" y="34" width="14" height="4" fill="#aaa092"/>
  <rect x="18" y="42" width="10" height="4" fill="#918779"/>

  <!-- Craters -->
  <rect x="46" y="46" width="8" height="8" fill="#3e3834"/>
  <rect x="30" y="56" width="5" height="5" fill="#37322f"/>
  <rect x="54" y="62" width="4" height="4" fill="#37322f"/>
</svg>