<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" shape-rendering="crispEdges">
  <title>Blue Explosion Frame 3</title>

  <!-- Fading blue smoke -->
  <rect x="32" y="8" width="16" height="16" fill="#5e7894"/>
  <rect x="56" y="16" width="16" height="16" fill="#48617a"/>
  <rect x="16" y="32" width="16" height="16" fill="#506b88"/>
  <rect x="72" y="32" width="16" height="16" fill="#3c526b"/>
  <rect x="24" y="64" width="16" height="16" fill="#3c526b"/>
  <rect x="56" y="72" width="16" height="16" fill="#2d4054"/>

  <!-- Remaining blue fire -->
  <rect x="32" y="32" width="32" height="8" fill="#1ca7ff"/>
  <rect x="24" y="40" width="48" height="16" fill="#006dff"/>
  <rect x="32" y="56" width="32" height="8" fill="#0047b8"/>

  <!-- Dim core -->
  <rect x="40" y="40" width="16" height="16" fill="#4ddcff"/>
  <rect x="48" y="48" width="8" height="8" fill="#e8ffff"/>

  <!-- Electric debris -->
  <rect x="8" y="24" width="8" height="8" fill="#7df9ff"/>
  <rect x="80" y="24" width="8" height="8" fill="#4ddcff"/>
  <rect x="8" y="72" width="8" height="8" fill="#006dff"/>
  <rect x="80" y="72" width="8" height="8" fill="#003fa3"/>
  <rect x="40" y="80" width="8" height="8" fill="#1ca7ff"/>
  <rect x="64" y="56" width="8" height="8" fill="#0047b8"/>

  <!-- Tiny sparks -->
  <rect x="48" y="16" width="8" height="8" fill="#7df9ff"/>
  <rect x="16" y="56" width="8" height="8" fill="#4ddcff"/>
  <rect x="72" y="56" width="8" height="8" fill="#4ddcff"/>
</svg>